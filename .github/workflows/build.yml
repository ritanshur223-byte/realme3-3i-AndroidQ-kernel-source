name: Realme 3i RMX1827 Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. Dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            git \
            libelf-dev \
            libncurses5-dev \
            libssl-dev \
            rsync \
            unzip \
            zip

      # ============================================================
      # 2. Checkout YOUR kernel fork
      # ============================================================
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ritanshur223-byte/realme3-3i-AndroidQ-kernel-source
          ref: master
          path: kernel
          fetch-depth: 1

      # ============================================================
      # 3. AArch64 GCC 4.9
      # ============================================================
      - name: Setup AArch64 GCC 4.9
        run: |
          git clone --depth=1 \
            -b lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            gcc

          echo "$GITHUB_WORKSPACE/gcc/bin" >> "$GITHUB_PATH"

      - name: Check compiler
        run: |
          echo "===== GCC ====="
          which aarch64-linux-android-gcc
          aarch64-linux-android-gcc --version

      # ============================================================
      # 4. Verify source files
      # ============================================================
      - name: Verify kernel source
        working-directory: kernel
        run: |
          set -e

          echo "===== SOURCE ====="
          pwd

          echo
          echo "===== KERNEL VERSION ====="
          head -n 8 Makefile

          echo
          echo "===== DEFCONFIG ====="
          test -f arch/arm64/configs/oppo6771_defconfig
          echo "oppo6771_defconfig FOUND"

          echo
          echo "===== DWS ====="
          test -f \
            drivers/misc/mediatek/dws/mt6771/oppo6771_18601.dws

          echo "oppo6771_18601.dws FOUND"

      # ============================================================
      # 5. Docker / Python 2
      # ============================================================
      - name: Setup Python 2 for DrvGen
        run: |
          set -e

          docker --version

          docker pull python:2.7

          docker run --rm \
            python:2.7 \
            python2 --version

          cat > /tmp/python2-drvgen <<'EOF'
          #!/bin/bash
          set -e

          HOST_KERNEL="$GITHUB_WORKSPACE/kernel"

          docker run --rm \
            -v "$HOST_KERNEL:$HOST_KERNEL" \
            -w "$HOST_KERNEL" \
            python:2.7 \
            python2 "$@"
          EOF

          chmod +x /tmp/python2-drvgen

          sudo cp \
            /tmp/python2-drvgen \
            /usr/local/bin/python2-drvgen

      # ============================================================
      # 6. DrvGen launcher
      # ============================================================
      - name: Patch DrvGen launcher
        working-directory: kernel
        run: |
          set -e

          test -f tools/dct/DrvGen.py

          mv \
            tools/dct/DrvGen.py \
            tools/dct/DrvGen.py.real

          cat > tools/dct/DrvGen.py <<'EOF'
          #!/bin/bash

          exec /usr/local/bin/python2-drvgen \
            tools/dct/DrvGen.py.real "$@"
          EOF

          chmod +x tools/dct/DrvGen.py

          echo "DrvGen Python 2 launcher installed"

      # ============================================================
      # 7. Configure
      # ============================================================
      - name: Configure kernel
        working-directory: kernel
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-

          echo "======================================"
          echo "        KERNEL CONFIGURATION"
          echo "======================================"

          make \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android- \
            oppo6771_defconfig

          echo
          echo "===== CONFIG CHECK ====="

          test -f out/.config

          echo "out/.config FOUND"

      # ============================================================
      # 8. Build kernel
      # ============================================================
      - name: Build kernel
        working-directory: kernel
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-

          echo "======================================"
          echo "       REALME 3i KERNEL BUILD"
          echo "======================================"

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android- \
            HOSTCFLAGS="-fcommon"

          echo
          echo "======================================"
          echo "       BUILD FINISHED"
          echo "======================================"

      # ============================================================
      # 9. Show build output
      # ============================================================
      - name: Show kernel output
        working-directory: kernel
        run: |
          echo "======================================"
          echo "          BUILD OUTPUT"
          echo "======================================"

          find out/arch/arm64/boot \
            -maxdepth 5 \
            -type f \
            -print

      # ============================================================
      # 10. Prepare artifact
      # ============================================================
      - name: Prepare kernel artifact
        run: |
          set -e

          mkdir -p kernel-output

          # ----------------------------
          # Kernel Image
          # ----------------------------

          if [ -f kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp \
              kernel/out/arch/arm64/boot/Image.gz-dtb \
              kernel-output/
          fi

          if [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
            cp \
              kernel/out/arch/arm64/boot/Image.gz \
              kernel-output/
          fi

          if [ -f kernel/out/arch/arm64/boot/Image ]; then
            cp \
              kernel/out/arch/arm64/boot/Image \
              kernel-output/
          fi

          # ----------------------------
          # DTB / DTBO
          # ----------------------------

          find kernel/out/arch/arm64/boot \
            -type f \
            \( \
              -name "*.dtb" \
              -o \
              -name "*.dtbo" \
            \) \
            -exec cp {} kernel-output/ \; \
            || true

          # ----------------------------
          # Kernel config
          # ----------------------------

          if [ -f kernel/out/.config ]; then
            cp \
              kernel/out/.config \
              kernel-output/kernel.config
          fi

          echo
          echo "======================================"
          echo "        FINAL KERNEL FILES"
          echo "======================================"

          ls -lah kernel-output

          echo
          echo "File count:"
          find kernel-output -type f | wc -l

          test \
            "$(find kernel-output -type f | wc -l)" \
            -gt 0

      # ============================================================
      # 11. Upload artifact
      # ============================================================
      - name: Upload RMX1827 kernel
        uses: actions/upload-artifact@v4
        with:
          name: RMX1827-Kernel
          path: kernel-output
          if-no-files-found: error
