name: Build Realme 3i Kernel

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Install Dependencies (SSL & Fast Mode)
      run: |
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends \
          ca-certificates curl build-essential bc bison flex libssl-dev libncurses5-dev \
          libelf-dev liblz4-tool git ccache lzop python2 python-is-python2
        update-ca-certificates

    - name: Clone GCC Toolchain
      run: |
        git config --global http.sslVerify false
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32

    - name: Compile Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        
        export PATH=$(pwd)/gcc64/bin:$(pwd)/gcc32/bin:$PATH
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-

        export KBUILD_BUILD_USER=ritansh
        export KBUILD_BUILD_HOST=github-actions
        
        # Stack protector error fix
        export KCFLAGS="-fno-pic -fno-async-unwind-tables -Wno-error -fno-stack-protector"
        
        make O=out oppo6771_defconfig
        
        # Disable stack protector in .config if enabled
        sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/' out/.config
        sed -i 's/CONFIG_CC_STACKPROTECTOR_AUTO=y/# CONFIG_CC_STACKPROTECTOR_AUTO is not set/' out/.config
        echo "CONFIG_CC_STACKPROTECTOR_NONE=y" >> out/.config

        make -j$(nproc --all) O=out

    - name: Upload Compiled Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Kernel-4.14.180
        path: |
          out/arch/arm64/boot/Image.gz-dtb
          out/arch/arm64/boot/Image.gz
          out/arch/arm64/boot/Image
