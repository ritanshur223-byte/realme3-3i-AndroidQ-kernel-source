name: Realme 3i RMX1827 Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            git \
            libelf-dev \
            libncurses5-dev \
            libssl-dev \
            rsync \
            unzip \
            zip

      # ============================================================
      # Checkout YOUR fork
      # ============================================================
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ritanshur223-byte/realme3-3i-AndroidQ-kernel-source
          ref: master
          path: kernel
          fetch-depth: 1

      # ============================================================
      # GCC 4.9
      # ============================================================
      - name: Setup AArch64 GCC 4.9
        run: |
          git clone --depth=1 \
            -b lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            gcc

          echo "$GITHUB_WORKSPACE/gcc/bin" >> "$GITHUB_PATH"

      - name: Check compiler
        run: |
          which aarch64-linux-android-gcc
          aarch64-linux-android-gcc --version

      # ============================================================
      # Verify source
      # ============================================================
      - name: Verify kernel source
        working-directory: kernel
        run: |
          echo "===== SOURCE ====="
          pwd

          echo "===== MAKEFILE ====="
          head -n 8 Makefile

          echo "===== DEFCONFIG ====="
          test -f arch/arm64/configs/oppo6771_defconfig
          echo "oppo6771_defconfig OK"

          echo "===== DWS ====="
          test -f drivers/misc/mediatek/dws/mt6771/oppo6771_18601.dws
          echo "oppo6771_18601.dws OK"

      # ============================================================
      # Python 2 for MediaTek DrvGen
      # ============================================================
      - name: Setup Python 2 DrvGen
        run: |
          docker --version
          docker pull python:2.7

          cat > /tmp/python2-drvgen <<'EOF'
          #!/bin/bash
          set -e

          HOST_KERNEL="$GITHUB_WORKSPACE/kernel"

          docker run --rm \
            -v "$HOST_KERNEL:$HOST_KERNEL" \
            -w "$HOST_KERNEL" \
            python:2.7 \
            python2 "$@"
          EOF

          chmod +x /tmp/python2-drvgen
          sudo cp /tmp/python2-drvgen /usr/local/bin/python2-drvgen

      # ============================================================
      # DrvGen launcher
      # ============================================================
      - name: Patch DrvGen launcher
        working-directory: kernel
        run: |
          mv tools/dct/DrvGen.py tools/dct/DrvGen.py.real

          cat > tools/dct/DrvGen.py <<'EOF'
          #!/bin/bash
          exec /usr/local/bin/python2-drvgen \
            tools/dct/DrvGen.py.real "$@"
          EOF

          chmod +x tools/dct/DrvGen.py

      # ============================================================
      # Configure
      # ============================================================
      - name: Configure kernel
        working-directory: kernel
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-

          make \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android- \
            srctree="$GITHUB_WORKSPACE/kernel" \
            oppo6771_defconfig

          echo
          echo "===== CONFIG CREATED ====="
          test -f out/.config
          echo "out/.config OK"

      # ============================================================
      # Build kernel
      # ============================================================
      - name: Build kernel
        working-directory: kernel
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-

          echo "======================================"
          echo "     REALME 3i KERNEL BUILD START"
          echo "======================================"

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android- \
            srctree="$GITHUB_WORKSPACE/kernel" \
            HOSTCFLAGS="-fcommon"

          echo
          echo "======================================"
          echo "     KERNEL BUILD FINISHED"
          echo "======================================"

      # ============================================================
      # Show output
      # ============================================================
      - name: Show kernel output
        working-directory: kernel
        run: |
          echo "===== ARM64 BOOT OUTPUT ====="

          find out/arch/arm64/boot \
            -maxdepth 4 \
            -type f \
            -print

      # ============================================================
      # Prepare artifacts
      # ============================================================
      - name: Prepare kernel artifact
        run: |
          set -e

          mkdir -p kernel-output

          if [ -f kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp kernel/out/arch/arm64/boot/Image.gz-dtb \
              kernel-output/
          fi

          if [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
            cp kernel/out/arch/arm64/boot/Image.gz \
              kernel-output/
          fi

          if [ -f kernel/out/arch/arm64/boot/Image ]; then
            cp kernel/out/arch/arm64/boot/Image \
              kernel-output/
          fi

          find kernel/out/arch/arm64/boot \
            -type f \
            \( -name "*.dtb" -o -name "*.dtbo" \) \
            -exec cp {} kernel-output/ \; \
            || true

          if [ -f kernel/out/.config ]; then
            cp kernel/out/.config \
              kernel-output/kernel.config
          fi

          echo
          echo "===== FINAL FILES ====="
          ls -lah kernel-output

          test "$(find kernel-output -type f | wc -l)" -gt 0

      # ============================================================
      # Upload
      # ============================================================
      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: RMX1827-Kernel
          path: kernel-output
          if-no-files-found: error
