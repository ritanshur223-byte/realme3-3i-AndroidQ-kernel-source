      - name: Setup Headers and Overwrite Layering Files
        run: |
          echo "Removing problematic fingerprint drivers..."
          rm -rf drivers/input/oppo_fp_drivers || true
          sed -i '/oppo_fp_drivers/d' drivers/input/Makefile || true
          sed -i '/oppo_fp_drivers/d' drivers/input/Kconfig || true

          echo "Injecting missing MTK Layering definitions into existing headers..."
          
          # Append missing enums and structs safely to all layering_rule.h files
          find . -name "layering_rule.h" -o -name "layering_rule_base.h" | while read -r header; do
            cat << 'EOF' >> "$header"

