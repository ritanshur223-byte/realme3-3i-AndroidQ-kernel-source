name: Realme 3i RMX1827 Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            git \
            libelf-dev \
            libncurses5-dev \
            libssl-dev \
            rsync \
            unzip \
            zip

      - name: Check Docker
        run: |
          docker --version
          docker run --rm python:2.7 python --version

      - name: Clone kernel source
        run: |
          git clone --depth=1 \
            https://github.com/realme-kernel-opensource/realme3-3i-AndroidQ-kernel-source.git \
            kernel

      - name: Setup AArch64 GCC 4.9
        run: |
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            gcc

          echo "$GITHUB_WORKSPACE/gcc/bin" >> "$GITHUB_PATH"

      - name: Check GCC
        run: |
          which aarch64-linux-android-gcc
          aarch64-linux-android-gcc --version

      - name: Check DWS file
        working-directory: kernel
        run: |
          echo "Checking required DWS file..."
          ls -lah drivers/misc/mediatek/dws/mt6771/
          test -f drivers/misc/mediatek/dws/mt6771/oppo6771_18601.dws

      - name: Create Python 2 DrvGen wrapper
        run: |
          cat > /tmp/python2-drvgen <<'EOF'
          #!/bin/bash

          HOST_KERNEL="$GITHUB_WORKSPACE/kernel"

          NEW_ARGS=()

          for ARG in "$@"; do
            case "$ARG" in
              "$HOST_KERNEL"/*)
                NEW_ARGS+=("/kernel/${ARG#"$HOST_KERNEL"/}")
                ;;
              *)
                NEW_ARGS+=("$ARG")
                ;;
            esac
          done

          exec docker run --rm \
            -v "$HOST_KERNEL:/kernel" \
            -w /kernel \
            python:2.7 \
            python2 "${NEW_ARGS[@]}"
          EOF

          chmod +x /tmp/python2-drvgen
          sudo cp /tmp/python2-drvgen /usr/local/bin/python2-drvgen

      - name: Patch DrvGen launcher
        working-directory: kernel
        run: |
          mv tools/dct/DrvGen.py tools/dct/DrvGen.py.real

          cat > tools/dct/DrvGen.py <<'EOF'
          #!/bin/bash
          exec /usr/local/bin/python2-drvgen tools/dct/DrvGen.py.real "$@"
          EOF

          chmod +x tools/dct/DrvGen.py

      - name: Configure kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android- \
            oppo6771_defconfig

      - name: Build kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android- \
            HOSTCFLAGS="-fcommon"

      - name: Show kernel files
        working-directory: kernel
        run: |
          echo "===== KERNEL OUTPUT ====="
          find out/arch/arm64/boot \
            -type f \
            -print

      - name: Prepare artifact
        run: |
          mkdir -p kernel-output

          if [ -f kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp kernel/out/arch/arm64/boot/Image.gz-dtb kernel-output/
          fi

          if [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
            cp kernel/out/arch/arm64/boot/Image.gz kernel-output/
          fi

          if [ -f kernel/out/arch/arm64/boot/Image ]; then
            cp kernel/out/arch/arm64/boot/Image kernel-output/
          fi

          find kernel/out/arch/arm64/boot \
            -type f \
            \( -name "*.dtb" -o -name "*.dtbo" \) \
            -exec cp {} kernel-output/ \; \
            || true

          if [ -f kernel/out/.config ]; then
            cp kernel/out/.config kernel-output/kernel.config
          fi

          echo "===== FINAL FILES ====="
          ls -lah kernel-output

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: RMX1827-Kernel
          path: kernel-output
          if-no-files-found: error
