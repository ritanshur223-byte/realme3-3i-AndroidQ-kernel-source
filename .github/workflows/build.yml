name: Build Realme 3i Kernel

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Install Dependencies & Tools
      run: |
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends \
          ca-certificates curl build-essential bc bison flex libssl-dev libncurses5-dev \
          libelf-dev liblz4-tool git ccache lzop python2 python-is-python2 sed make
        update-ca-certificates

    # Cache GCC toolchains so they are never downloaded twice
    - name: Cache GCC Toolchains
      uses: actions/cache@v4
      id: cache-toolchains
      with:
        path: |
          gcc64
          gcc32
        key: gcc-toolchain-4.9-aosp-stable-v1

    - name: Clone Official AOSP GCC Toolchains (Skipped if cached)
      if: steps.cache-toolchains.outputs.cache-hit != 'true'
      run: |
        mkdir -p gcc64 gcc32
        echo "Cloning official AOSP GCC 4.9 toolchains directly..."
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc64
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 gcc32

    - name: Fast Incremental Kernel Compilation
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        
        # Set absolute paths directly for foolproof compiler detection
        export CROSS_COMPILE=$(pwd)/gcc64/bin/aarch64-linux-android-
        export CROSS_COMPILE_ARM32=$(pwd)/gcc32/bin/arm-linux-androideabi-
        export PATH=$(pwd)/gcc64/bin:$(pwd)/gcc32/bin:$PATH

        export KBUILD_BUILD_USER=ritansh
        export KBUILD_BUILD_HOST=github-actions

        # Fix python interpreter path for old kernel scripts
        ln -sf /usr/bin/python2 /usr/bin/python

        # Run clean and defconfig FIRST
        if [ ! -f ".config" ]; then
          echo "Running clean build setup..."
          make clean || true
          make oppo6771_defconfig
        else
          echo "Resuming previous build state (Incremental Build)..."
        fi

        # CREATE STUB HEADERS FOR OTHER MISSING FILES
        mkdir -p drivers/devfreq drivers/extcon include/soc/qcom drivers/input/touchscreen/mediatek/hq_green/gpio_touch_driver-v1.0.3.8/core

        cat << 'EOF' > drivers/devfreq/helio-dvforc.h
        #ifndef HELIO_DVFORC_H
        #define HELIO_DVFORC_H
        #endif
        EOF

        cat << 'EOF' > drivers/extcon/extcon_usb.h
        #ifndef EXTCON_USB_H
        #define EXTCON_USB_H
        #endif
        EOF

        cat << 'EOF' > include/soc/qcom/smem.h
        #ifndef __SOC_QCOM_SMEM_H
        #define __SOC_QCOM_SMEM_H
        #endif
        EOF

        cat << 'EOF' > drivers/input/touchscreen/mediatek/hq_green/gpio_touch_driver-v1.0.3.8/core/firmware.h
        #ifndef CORE_FIRMWARE_H
        #define CORE_FIRMWARE_H
        #endif
        EOF

        # Completely remove broken rrdump module so it never throws errors again
        if [ -d "drivers/misc/mediatek/see/rrdump" ]; then
          rm -rf drivers/misc/mediatek/see/rrdump
          echo "Removed drivers/misc/mediatek/see/rrdump successfully."
        fi
        if [ -f "drivers/misc/mediatek/see/Makefile" ]; then
          sed -i '/rrdump/d' drivers/misc/mediatek/see/Makefile || true
        fi

        # Create oppo_phoenix.h stub safely
        mkdir -p vendor/oppo/oppo_phoenix/kernel/oppo_phoenix/
        cat << 'EOF' > vendor/oppo/oppo_phoenix/kernel/oppo_phoenix/oppo_phoenix.h
        #ifndef OPPO_PHOENIX_H
        #define OPPO_PHOENIX_H

        #define KERNEL_INIT_DONE 1
        #define KERNEL_DO_BASIC_SETUP_DONE 2
        #define KERNEL_MM_INIT_DONE 3
        #define KERNEL_LOCAL_IRQ_ENABLE 4
        #define KERNEL_DELAYACCT_INIT_DONE 5
        #define KERNEL_DRIVER_INIT_DONE 6
        #define KERNEL_DO_INITCALLS_DONE 7

        #define ERROR_KERNEL_PANIC 10
        #define ERROR_HWT 11

        static inline void phx_set_boot_stage(int stage) { (void)stage; }
        static inline int phx_phoenix_boot_completed(void) { return 1; }
        static inline void phx_set_boot_error(int error) { (void)error; }

        #endif
        EOF

        # Completely remove broken oppocfs module so it never throws errors again
        if [ -d "kernel/oppocfs" ]; then
          rm -rf kernel/oppocfs
          echo "Removed kernel/oppocfs successfully."
        fi
        if [ -f "kernel/Makefile" ]; then
          sed -i '/oppocfs/d' kernel/Makefile || true
        fi

        if [ -f "fs/sdcardfs/main.c" ]; then
          sed -i 's/pr_info("Registering sdcardfs " SDCARDFS_VERSION/pr_info("Registering sdcardfs v2.0"/g' fs/sdcardfs/main.c || true
        fi

        # Disable stack protector options in .config
        if [ -f ".config" ]; then
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/' .config
          sed -i 's/CONFIG_CC_STACKPROTECTOR_AUTO=y/# CONFIG_CC_STACKPROTECTOR_AUTO is not set/' .config
          grep -q "CONFIG_CC_STACKPROTECTOR_NONE=y" .config || echo "CONFIG_CC_STACKPROTECTOR_NONE=y" >> .config
          
          # Disable VDSO to prevent linking crashes
          sed -i 's/CONFIG_VDSO=y/# CONFIG_VDSO is not set/' .config || true
          sed -i 's/CONFIG_COMPAT_VDSO=y/# CONFIG_COMPAT_VDSO is not set/' .config || true
          grep -q "# CONFIG_VDSO is not set" .config || echo "# CONFIG_VDSO is not set" >> .config
        fi

        # Define include paths variable
        INCLUDES="-I$(pwd)/drivers/devfreq -I$(pwd)/drivers/extcon -I$(pwd)/drivers/input/touchscreen/mediatek/hq_green/gpio_touch_driver-v1.0.3.8"

        # Step 1: Build scripts safely
        make -j1 scripts prepare HOSTCFLAGS="-w" HOSTCXXFLAGS="-w"

        # Step 2: Compile kernel with absolute paths & include paths
        make -j4 \
          HOSTCFLAGS="-w" \
          HOSTCXXFLAGS="-w" \
          KCFLAGS="-w -fno-stack-protector $INCLUDES" \
          EXTRA_CFLAGS="-w $INCLUDES" || {
            echo "Parallel build failed! Retrying with single thread to catch exact error..."
            make -j1 \
              HOSTCFLAGS="-w" \
              HOSTCXXFLAGS="-w" \
              KCFLAGS="-w -fno-stack-protector $INCLUDES" \
              EXTRA_CFLAGS="-w $INCLUDES"
          }

    - name: Upload Compiled Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Kernel-4.14.180
        path: |
          arch/arm64/boot/Image.gz-dtb
          arch/arm64/boot/Image.gz
          arch/arm64/boot/Image
