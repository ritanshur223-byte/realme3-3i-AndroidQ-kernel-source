name: Build Realme 3i Kernel

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential bc bison flex libssl-dev libncurses5-dev \
          libelf-dev liblz4-tool git ccache lzop python2 python-is-python2 sed make

    - name: Clone LineageOS GCC Toolchains
      run: |
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32

    - name: Compile Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        
        export PATH=$(pwd)/gcc64/bin:$(pwd)/gcc32/bin:$PATH
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-

        export KBUILD_BUILD_USER=ritansh
        export KBUILD_BUILD_HOST=github-actions

        # Clean build setup
        make clean || true
        make oppo6771_defconfig

        # 1. CREATE STUB HEADERS
        mkdir -p drivers/devfreq drivers/extcon include/soc/qcom drivers/input/touchscreen/mediatek/hq_green/gpio_touch_driver-v1.0.3.8/core

        cat << 'EOF' > drivers/devfreq/helio-dvforc.h
        #ifndef HELIO_DVFORC_H
        #define HELIO_DVFORC_H
        #endif
        EOF

        cat << 'EOF' > drivers/extcon/extcon_usb.h
        #ifndef EXTCON_USB_H
        #define EXTCON_USB_H
        #endif
        EOF

        cat << 'EOF' > include/soc/qcom/smem.h
        #ifndef __SOC_QCOM_SMEM_H
        #define __SOC_QCOM_SMEM_H
        #endif
        EOF

        cat << 'EOF' > drivers/input/touchscreen/mediatek/hq_green/gpio_touch_driver-v1.0.3.8/core/firmware.h
        #ifndef CORE_FIRMWARE_H
        #define CORE_FIRMWARE_H
        #endif
        EOF

        # 2. EXACT FIX FOR LINE 2700 (rrdump & ordasp)
        mkdir -p drivers/misc/mediatek/see/ordasp
        mkdir -p drivers/misc/mediatek/see/rrdump
        mkdir -p drivers/misc/mediatek/aee/rrdump
        
        touch drivers/misc/mediatek/see/ordasp/rrdump_private.h
        touch drivers/misc/mediatek/see/rrdump/rrdump_private.h
        touch drivers/misc/mediatek/aee/rrdump/rrdump_private.h

        find drivers/misc/mediatek/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/#include\s*["<]rrdump_private.h[">]/\/\/#include "rrdump_private.h"/g' {} +

        # 3. OPPO PHOENIX STUB
        mkdir -p vendor/oppo/oppo_phoenix/kernel/oppo_phoenix/
        cat << 'EOF' > vendor/oppo/oppo_phoenix/kernel/oppo_phoenix/oppo_phoenix.h
        #ifndef OPPO_PHOENIX_H
        #define OPPO_PHOENIX_H

        #define KERNEL_INIT_DONE 1
        #define KERNEL_DO_BASIC_SETUP_DONE 2
        #define KERNEL_MM_INIT_DONE 3
        #define KERNEL_LOCAL_IRQ_ENABLE 4
        #define KERNEL_DELAYACCT_INIT_DONE 5
        #define KERNEL_DRIVER_INIT_DONE 6
        #define KERNEL_DO_INITCALLS_DONE 7

        #define ERROR_KERNEL_PANIC 10
        #define ERROR_HWT 11

        static inline void phx_set_boot_stage(int stage) { (void)stage; }
        static inline int phx_phoenix_boot_completed(void) { return 1; }
        static inline void phx_set_boot_error(int error) { (void)error; }

        #endif
        EOF

        # 4. REMOVE BROKEN MODULES
        if [ -d "kernel/oppocfs" ]; then
          rm -rf kernel/oppocfs
        fi
        if [ -f "kernel/Makefile" ]; then
          sed -i '/oppocfs/d' kernel/Makefile || true
        fi

        if [ -f "fs/sdcardfs/main.c" ]; then
          sed -i 's/pr_info("Registering sdcardfs " SDCARDFS_VERSION/pr_info("Registering sdcardfs v2.0"/g' fs/sdcardfs/main.c || true
        fi

        # 5. DISABLE VDSO & STACK PROTECTOR
        if [ -f ".config" ]; then
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/' .config
          sed -i 's/CONFIG_CC_STACKPROTECTOR_AUTO=y/# CONFIG_CC_STACKPROTECTOR_AUTO is not set/' .config
          grep -q "CONFIG_CC_STACKPROTECTOR_NONE=y" .config || echo "CONFIG_CC_STACKPROTECTOR_NONE=y" >> .config
          
          sed -i 's/CONFIG_VDSO=y/# CONFIG_VDSO is not set/' .config || true
          sed -i 's/CONFIG_COMPAT_VDSO=y/# CONFIG_COMPAT_VDSO is not set/' .config || true
          grep -q "# CONFIG_VDSO is not set" .config || echo "# CONFIG_VDSO is not set" >> .config
        fi

        INCLUDES="-I$(pwd)/drivers/devfreq -I$(pwd)/drivers/extcon -I$(pwd)/drivers/input/touchscreen/mediatek/hq_green/gpio_touch_driver-v1.0.3.8 -I$(pwd)/drivers/misc/mediatek/see/ordasp -I$(pwd)/drivers/misc/mediatek/aee/rrdump"

        make -j1 scripts prepare HOSTCFLAGS="-w" HOSTCXXFLAGS="-w"

        make -j4 \
          HOSTCFLAGS="-w" \
          HOSTCXXFLAGS="-w" \
          KCFLAGS="-w -fno-stack-protector $INCLUDES" \
          EXTRA_CFLAGS="-w $INCLUDES"

    - name: Upload Compiled Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Kernel-4.14.180
        path: |
          arch/arm64/boot/Image.gz-dtb
          arch/arm64/boot/Image.gz
          arch/arm64/boot/Image
          
