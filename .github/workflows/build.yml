name: Realme 3i RMX1827 Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            git \
            libelf-dev \
            libncurses5-dev \
            libssl-dev \
            python3 \
            rsync \
            unzip \
            zip

      - name: Clone kernel source
        run: |
          git clone --depth=1 \
            https://github.com/realme-kernel-opensource/realme3-3i-AndroidQ-kernel-source.git \
            kernel

      - name: Setup AArch64 GCC
        run: |
          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            gcc

          echo "$GITHUB_WORKSPACE/gcc/bin" >> "$GITHUB_PATH"

      - name: Check compiler
        run: |
          which aarch64-linux-android-gcc
          aarch64-linux-android-gcc --version

      - name: Configure kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-

          make O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android- \
            oppo6771_defconfig

      - name: Build kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-

          make -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android-

      - name: Show kernel files
        working-directory: kernel
        run: |
          echo "===== KERNEL OUTPUT ====="

          find out/arch/arm64/boot \
            -type f \
            -print

      - name: Prepare artifact
        run: |
          mkdir -p kernel-output

          if [ -f kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp kernel/out/arch/arm64/boot/Image.gz-dtb kernel-output/
          fi

          if [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
            cp kernel/out/arch/arm64/boot/Image.gz kernel-output/
          fi

          if [ -f kernel/out/arch/arm64/boot/Image ]; then
            cp kernel/out/arch/arm64/boot/Image kernel-output/
          fi

          find kernel/out/arch/arm64/boot \
            -type f \
            \( -name "*.dtb" -o -name "*.dtbo" \) \
            -exec cp {} kernel-output/ \; \
            || true

          cp kernel/out/.config kernel-output/kernel.config

          echo "===== FINAL FILES ====="
          ls -lah kernel-output

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: RMX1827-Kernel
          path: kernel-output
          if-no-files-found: error
