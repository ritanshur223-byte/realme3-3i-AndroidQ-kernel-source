name: Build Realme 3i Kernel

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Install Dependencies (Fast Mode)
      run: |
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends \
          build-essential bc bison flex libssl-dev libncurses5-dev \
          libelf-dev liblz4-tool git ccache lzop python2 python-is-python2

    - name: Clone GCC Toolchain
      run: |
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32

    - name: Compile Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        
        # Toolchain PATH fixed
        export PATH=$(pwd)/gcc64/bin:$(pwd)/gcc32/bin:$PATH
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-
        
        make O=out oppo6771_defconfig
        make -j$(nproc --all) O=out

    - name: Upload Compiled Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Kernel-4.14.180
        path: |
          out/arch/arm64/boot/Image.gz-dtb
          out/arch/arm64/boot/Image.gz
          out/arch/arm64/boot/Image
