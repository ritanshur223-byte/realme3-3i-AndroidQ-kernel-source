name: Build Realme 3i Kernel

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses5-dev libncursesw5-dev libelf-dev liblz4-tool git ccache clang 2to3 python3-2to3

    - name: Auto-Heal Legacy Python Scripts
      run: |
        echo "Auto-fixing legacy Python 2 scripts to Python 3..."
        # MediaTek ke DrvGen.py aur baki Python 2 scripts ko auto-fix karega
        2to3 -w -n ./tools/ ./scripts/ || true
        find . -type f -name "*.py" -exec sed -i -E 's/print "([^"]*)"/print("\1")/g' {} + || true

    - name: Clone GCC Toolchain
      run: |
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32

    - name: Compile Kernel
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=$(pwd)/gcc64/bin/aarch64-linux-android-
        export CROSS_COMPILE_ARM32=$(pwd)/gcc32/bin/arm-linux-androideabi-
        
        make O=out oppo6771_defconfig
        make -j$(nproc --all) O=out

    - name: Upload Compiled Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Kernel-4.14.180
        path: |
          out/arch/arm64/boot/Image.gz-dtb
          out/arch/arm64/boot/Image.gz
          out/arch/arm64/boot/Image
          
