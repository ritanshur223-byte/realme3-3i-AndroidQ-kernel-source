name: Realme 3i RMX1827 Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. Dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            git \
            libelf-dev \
            libncurses5-dev \
            libssl-dev \
            rsync \
            unzip \
            zip

      # ============================================================
      # 2. Checkout YOUR fork
      # ============================================================
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ritanshur223-byte/realme3-3i-AndroidQ-kernel-source
          ref: master
          path: kernel
          fetch-depth: 1

      # ============================================================
      # 3. GCC 4.9
      # ============================================================
      - name: Setup AArch64 GCC 4.9
        run: |
          set -e

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            gcc

          echo "$GITHUB_WORKSPACE/gcc/bin" >> "$GITHUB_PATH"

      - name: Check GCC
        run: |
          set -e

          echo "===== GCC ====="

          which aarch64-linux-android-gcc

          aarch64-linux-android-gcc --version

      # ============================================================
      # 4. Verify exact source files
      # ============================================================
      - name: Verify source
        working-directory: kernel
        run: |
          set -e

          echo "===== SOURCE ====="
          pwd

          echo
          echo "===== VERSION ====="
          head -n 6 Makefile

          echo
          echo "===== DEFCONFIG ====="
          test -f arch/arm64/configs/oppo6771_defconfig
          echo "OK: oppo6771_defconfig"

          echo
          echo "===== DTS ====="
          test -f \
            arch/arm64/boot/dts/mediatek/oppo6771_18601.dts
          echo "OK: oppo6771_18601.dts"

          echo
          echo "===== DWS ====="
          test -f \
            drivers/misc/mediatek/dws/mt6771/oppo6771_18601.dws
          echo "OK: oppo6771_18601.dws"

          echo
          echo "===== DWS SIZE ====="
          wc -c \
            drivers/misc/mediatek/dws/mt6771/oppo6771_18601.dws

      # ============================================================
      # 5. Python 2 DrvGen
      # ============================================================
      - name: Setup Python 2
        run: |
          set -e

          docker --version

          docker pull python:2.7

          docker run --rm \
            python:2.7 \
            python2 --version

          cat > /tmp/python2-drvgen <<'EOF'
          #!/bin/bash
          set -e

          HOST_KERNEL="$GITHUB_WORKSPACE/kernel"

          docker run --rm \
            -v "$HOST_KERNEL:$HOST_KERNEL" \
            -w "$HOST_KERNEL" \
            python:2.7 \
            python2 "$@"
          EOF

          chmod +x /tmp/python2-drvgen

          sudo cp \
            /tmp/python2-drvgen \
            /usr/local/bin/python2-drvgen

      # ============================================================
      # 6. Fix DRVGEN_OUT inheritance
      # ============================================================
      - name: Fix DrvGen output path
        working-directory: kernel
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          p = Path("scripts/drvgen/drvgen.mk")
          s = p.read_text()

          old = """ifndef DRVGEN_OUT
          DRVGEN_OUT := $(objtree)/arch/$(SRCARCH)/boot/dts
          endif
          export DRVGEN_OUT"""

          new = """DRVGEN_OUT := $(objtree)/arch/$(SRCARCH)/boot/dts
          export DRVGEN_OUT"""

          if old not in s:
              raise SystemExit(
                  "ERROR: expected DRVGEN_OUT block was not found"
              )

          p.write_text(s.replace(old, new))

          print("DRVGEN_OUT fix applied")
          PY

          echo
          echo "===== DRVGEN_OUT ====="

          grep -n -A3 -B2 \
            "DRVGEN_OUT" \
            scripts/drvgen/drvgen.mk

      # ============================================================
      # 7. Restore original DrvGen and create launcher
      # ============================================================
      - name: Setup DrvGen launcher
        working-directory: kernel
        run: |
          set -e

          test -f tools/dct/DrvGen.py

          mv \
            tools/dct/DrvGen.py \
            tools/dct/DrvGen.py.real

          cat > tools/dct/DrvGen.py <<'EOF'
          #!/bin/bash

          exec /usr/local/bin/python2-drvgen \
            tools/dct/DrvGen.py.real "$@"
          EOF

          chmod +x tools/dct/DrvGen.py

          echo "DrvGen launcher ready"

      # ============================================================
      # 8. Configure
      # ============================================================
      - name: Configure kernel
        working-directory: kernel
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-

          echo "======================================"
          echo "        KERNEL CONFIGURATION"
          echo "======================================"

          make \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android- \
            oppo6771_defconfig

          test -f out/.config

          echo
          echo "CONFIGURATION OK"

      # ============================================================
      # 9. Check output path BEFORE full build
      # ============================================================
      - name: Check Kbuild paths
        working-directory: kernel
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-

          mkdir -p out/arch/arm64/boot/dts

          echo "===== EXPECTED OUTPUT DIRECTORY ====="

          test -d \
            out/arch/arm64/boot/dts

          echo "OK: out/arch/arm64/boot/dts"

          echo
          echo "===== DWS ====="

          test -f \
            drivers/misc/mediatek/dws/mt6771/oppo6771_18601.dws

          echo "OK: DWS exists"

      # ============================================================
      # 10. Build
      # ============================================================
      - name: Build kernel
        working-directory: kernel
        run: |
          set -e

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-

          echo "======================================"
          echo "       REALME 3i KERNEL BUILD"
          echo "======================================"

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android- \
            HOSTCFLAGS="-fcommon" \
            V=1

          echo
          echo "======================================"
          echo "       BUILD FINISHED"
          echo "======================================"

      # ============================================================
      # 11. Show output
      # ============================================================
      - name: Show kernel output
        working-directory: kernel
        run: |
          set -e

          echo "======================================"
          echo "          KERNEL OUTPUT"
          echo "======================================"

          find \
            out/arch/arm64/boot \
            -type f \
            -print

      # ============================================================
      # 12. Prepare artifacts
      # ============================================================
      - name: Prepare kernel artifact
        run: |
          set -e

          mkdir -p kernel-output

          # Image
          if [ -f kernel/out/arch/arm64/boot/Image ]; then
            cp \
              kernel/out/arch/arm64/boot/Image \
              kernel-output/
          fi

          # Image.gz
          if [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
            cp \
              kernel/out/arch/arm64/boot/Image.gz \
              kernel-output/
          fi

          # Image-dtb
          if [ -f kernel/out/arch/arm64/boot/Image-dtb ]; then
            cp \
              kernel/out/arch/arm64/boot/Image-dtb \
              kernel-output/
          fi

          # Image.gz-dtb
          if [ -f kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp \
              kernel/out/arch/arm64/boot/Image.gz-dtb \
              kernel-output/
          fi

          # DTB / DTBO
          find \
            kernel/out/arch/arm64/boot \
            -type f \
            \( \
              -name "*.dtb" \
              -o \
              -name "*.dtbo" \
            \) \
            -exec cp {} kernel-output/ \;

          # Config
          if [ -f kernel/out/.config ]; then
            cp \
              kernel/out/.config \
              kernel-output/kernel.config
          fi

          echo
          echo "======================================"
          echo "        FINAL FILES"
          echo "======================================"

          ls -lah kernel-output

          COUNT=$(find kernel-output -type f | wc -l)

          echo
          echo "Files: $COUNT"

          test "$COUNT" -gt 0

      # ============================================================
      # 13. Upload
      # ============================================================
      - name: Upload RMX1827 Kernel
        uses: actions/upload-artifact@v4
        with:
          name: RMX1827-Kernel
          path: kernel-output
          if-no-files-found: error
