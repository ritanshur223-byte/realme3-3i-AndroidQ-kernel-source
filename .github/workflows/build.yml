name: Build Realme 3i Kernel

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Install Dependencies & Tools
      run: |
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends \
          ca-certificates curl build-essential bc bison flex libssl-dev libncurses5-dev \
          libelf-dev liblz4-tool git ccache lzop python2 python-is-python2 libfdt-dev sed make
        update-ca-certificates

    - name: Clone GCC Toolchain
      run: |
        git config --global http.sslVerify false
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32

    - name: Compile Kernel Final Fix
      run: |
        export ARCH=arm64
        export SUBARCH=arm64
        
        export PATH=$(pwd)/gcc64/bin:$(pwd)/gcc32/bin:$PATH
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-

        export KBUILD_BUILD_USER=ritansh
        export KBUILD_BUILD_HOST=github-actions

        make clean || true
        make oppo6771_defconfig

        # Disable stack protector options in .config
        if [ -f ".config" ]; then
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/' .config
          sed -i 's/CONFIG_CC_STACKPROTECTOR_AUTO=y/# CONFIG_CC_STACKPROTECTOR_AUTO is not set/' .config
          echo "CONFIG_CC_STACKPROTECTOR_NONE=y" >> .config
        fi

        # Step 1: Build scripts safely
        make -j1 scripts prepare HOSTCFLAGS="-fcommon -Wno-error" HOSTCXXFLAGS="-fcommon -Wno-error"

        # Step 2: Compile main kernel with clean KCFLAGS (removed problematic flags)
        make -j$(nproc --all) \
          HOSTCFLAGS="-fcommon -Wno-error" \
          HOSTCXXFLAGS="-fcommon -Wno-error" \
          KCFLAGS="-Wno-error -fno-stack-protector"

    - name: Upload Compiled Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Kernel-4.14.180
        path: |
          arch/arm64/boot/Image.gz-dtb
          arch/arm64/boot/Image.gz
          arch/arm64/boot/Image
