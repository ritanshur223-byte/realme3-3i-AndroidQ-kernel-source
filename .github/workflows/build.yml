name: Realme 3i RMX1827 Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. Dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            git \
            libelf-dev \
            libncurses5-dev \
            libssl-dev \
            rsync \
            unzip \
            zip

      # ============================================================
      # 2. Checkout YOUR fork
      # ============================================================
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ritanshur223-byte/realme3-3i-AndroidQ-kernel-source
          ref: master
          path: kernel
          fetch-depth: 1

      # ============================================================
      # 3. Verify exact RMX1827 source files
      # ============================================================
      - name: Verify RMX1827 source
        working-directory: kernel
        run: |
          set -eux

          echo "=========================================="
          echo "RMX1827 SOURCE CHECK"
          echo "=========================================="

          echo "PWD:"
          pwd

          echo
          echo "Git commit:"
          git rev-parse HEAD

          echo
          echo "Makefile:"
          head -n 10 Makefile

          echo
          echo "Checking defconfig..."
          test -f arch/arm64/configs/oppo6771_defconfig

          echo
          echo "Checking DTS..."
          test -f arch/arm64/boot/dts/mediatek/oppo6771_18601.dts

          echo
          echo "Checking DWS..."
          test -f drivers/misc/mediatek/dws/mt6771/oppo6771_18601.dws

          echo
          echo "DWS information:"
          ls -lah \
            drivers/misc/mediatek/dws/mt6771/oppo6771_18601.dws

          wc -c \
            drivers/misc/mediatek/dws/mt6771/oppo6771_18601.dws

          echo
          echo "SOURCE CHECK OK"

      # ============================================================
      # 4. AArch64 GCC 4.9
      # ============================================================
      - name: Setup AArch64 GCC 4.9
        run: |
          set -eux

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            gcc

          echo "$GITHUB_WORKSPACE/gcc/bin" >> "$GITHUB_PATH"

      # ============================================================
      # 5. Verify compiler
      # ============================================================
      - name: Check compiler
        run: |
          set -eux

          which aarch64-linux-android-gcc

          aarch64-linux-android-gcc --version

      # ============================================================
      # 6. Check Docker + Python 2
      # ============================================================
      - name: Setup Python 2 environment
        run: |
          set -eux

          docker --version

          docker pull python:2.7

          docker run --rm \
            python:2.7 \
            python2 --version

      # ============================================================
      # 7. Fix drvgen.mk output path
      # ============================================================
      - name: Fix Driver Generator output path
        working-directory: kernel
        run: |
          set -eux

          python3 - <<'PY'
          from pathlib import Path

          p = Path("scripts/drvgen/drvgen.mk")
          s = p.read_text()

          old = """ifndef DRVGEN_OUT
          DRVGEN_OUT := $(objtree)/arch/$(SRCARCH)/boot/dts
          endif
          export DRVGEN_OUT"""

          new = """DRVGEN_OUT := $(objtree)/arch/$(SRCARCH)/boot/dts
          export DRVGEN_OUT"""

          if old not in s:
              raise SystemExit(
                  "ERROR: DRVGEN_OUT block not found. "
                  "Repository version is unexpected."
              )

          s = s.replace(old, new)

          p.write_text(s)

          print("DRVGEN_OUT FIXED")
          PY

          echo
          echo "DRVGEN_OUT lines:"
          grep -n -A4 -B2 "DRVGEN_OUT" scripts/drvgen/drvgen.mk

      # ============================================================
      # 8. Enable DWS dependency explicitly
      # ============================================================
      - name: Enable DWS dependency
        working-directory: kernel
        run: |
          set -eux

          python3 - <<'PY'
          from pathlib import Path

          p = Path("scripts/drvgen/drvgen.mk")
          s = p.read_text()

          old = "#DWS_FILE := $(srctree)/$(DRVGEN_PATH)/$(MTK_PROJECT).dws"
          new = "DWS_FILE := $(srctree)/$(DRVGEN_PATH)/$(MTK_PROJECT).dws"

          if old in s:
              s = s.replace(old, new)
              p.write_text(s)
              print("DWS_FILE dependency enabled")
          elif new in s:
              print("DWS_FILE already enabled")
          else:
              raise SystemExit(
                  "ERROR: Could not find DWS_FILE definition"
              )
          PY

          grep -n "DWS_FILE" scripts/drvgen/drvgen.mk

      # ============================================================
      # 9. Create ROBUST Python 2 DrvGen launcher
      #
      # IMPORTANT:
      # Host path:
      # /home/runner/work/.../kernel/...
      #
      # Docker path:
      # /workspace/kernel/...
      #
      # Every argument is translated automatically.
      # ============================================================
      - name: Install Python 2 DrvGen launcher
        working-directory: kernel
        run: |
          set -eux

          test -f tools/dct/DrvGen.py

          mv tools/dct/DrvGen.py tools/dct/DrvGen.py.real

          cat > tools/dct/DrvGen.py <<'EOF'
          #!/bin/bash

          set -eu

          HOST_KERNEL="$GITHUB_WORKSPACE/kernel"
          DOCKER_KERNEL="/workspace/kernel"

          translated_args=()

          for arg in "$@"; do
              case "$arg" in
                  "$HOST_KERNEL"/*)
                      translated_args+=(
                        "$DOCKER_KERNEL${arg#$HOST_KERNEL}"
                      )
                      ;;
                  *)
                      translated_args+=("$arg")
                      ;;
              esac
          done

          exec docker run --rm \
              -v "$HOST_KERNEL:$DOCKER_KERNEL" \
              -w "$DOCKER_KERNEL" \
              python:2.7 \
              python2 \
              /workspace/kernel/tools/dct/DrvGen.py.real \
              "${translated_args[@]}"
          EOF

          chmod +x tools/dct/DrvGen.py

          echo
          echo "DrvGen launcher:"
          cat tools/dct/DrvGen.py

      # ============================================================
      # 10. DIRECT Docker visibility test
      #
      # This tests the EXACT DWS file using Python 2 INSIDE Docker.
      # If this passes, the old Error 255 path problem is eliminated.
      # ============================================================
      - name: Verify DWS inside Python 2 Docker
        working-directory: kernel
        run: |
          set -eux

          HOST_KERNEL="$GITHUB_WORKSPACE/kernel"

          echo "Host kernel:"
          echo "$HOST_KERNEL"

          echo
          echo "Host DWS:"
          ls -lah \
            "$HOST_KERNEL/drivers/misc/mediatek/dws/mt6771/oppo6771_18601.dws"

          echo
          echo "Checking DWS inside Docker..."

          docker run --rm \
            -v "$HOST_KERNEL:/workspace/kernel" \
            -w /workspace/kernel \
            python:2.7 \
            python2 -c "
          import os
          p='/workspace/kernel/drivers/misc/mediatek/dws/mt6771/oppo6771_18601.dws'
          print('DWS:', p)
          print('exists:', os.path.exists(p))
          print('isfile:', os.path.isfile(p))
          assert os.path.isfile(p)
          "

          echo
          echo "DOCKER DWS CHECK OK"

      # ============================================================
      # 11. Configure kernel
      # ============================================================
      - name: Configure kernel
        working-directory: kernel
        run: |
          set -eux

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-

          rm -rf out

          make \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android- \
            oppo6771_defconfig

          test -f out/.config

          echo
          echo "CONFIGURATION OK"

          echo
          echo "Important config:"
          grep -E \
            'CONFIG_MACH_MT6771|CONFIG_MTK_PLATFORM|CONFIG_ARCH_MTK_PROJECT|CONFIG_BUILD_ARM64' \
            out/.config || true

      # ============================================================
      # 12. Check Kbuild variables
      # ============================================================
      - name: Verify Kbuild Driver Generator paths
        working-directory: kernel
        run: |
          set -eux

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-

          mkdir -p out/arch/arm64/boot/dts

          echo
          echo "Source tree:"
          pwd

          echo
          echo "Expected DWS:"
          realpath \
            drivers/misc/mediatek/dws/mt6771/oppo6771_18601.dws

          echo
          echo "Expected output:"
          realpath \
            out/arch/arm64/boot/dts

          echo
          echo "DWS test:"
          test -f \
            drivers/misc/mediatek/dws/mt6771/oppo6771_18601.dws

          echo
          echo "OUTPUT DIRECTORY test:"
          test -d \
            out/arch/arm64/boot/dts

          echo
          echo "KBUILD PATH CHECK OK"

      # ============================================================
      # 13. Run Driver Generator separately BEFORE full kernel build
      #
      # This forces the exact problematic operation first.
      # ============================================================
      - name: Test MediaTek Driver Generator
        working-directory: kernel
        run: |
          set -eux

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-

          mkdir -p \
            out/arch/arm64/boot/dts/oppo6771_18601

          echo
          echo "=========================================="
          echo "TESTING DRVGEN"
          echo "=========================================="

          tools/dct/DrvGen.py \
            "$(pwd)/drivers/misc/mediatek/dws/mt6771/oppo6771_18601.dws" \
            "$(pwd)/out/arch/arm64/boot/dts/oppo6771_18601" \
            "$(pwd)/out/arch/arm64/boot/dts/oppo6771_18601" \
            cust.dtsi

          echo
          echo "DRVGEN TEST FINISHED"

          echo
          echo "Generated files:"
          find \
            out/arch/arm64/boot/dts/oppo6771_18601 \
            -maxdepth 2 \
            -type f \
            -print

          test -f \
            out/arch/arm64/boot/dts/oppo6771_18601/cust.dtsi

      # ============================================================
      # 14. FULL KERNEL BUILD
      # ============================================================
      - name: Build kernel
        working-directory: kernel
        run: |
          set -eux

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-

          echo
          echo "=========================================="
          echo "REALME 3i RMX1827 KERNEL BUILD"
          echo "=========================================="

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android- \
            HOSTCFLAGS="-fcommon" \
            V=1

          echo
          echo "=========================================="
          echo "BUILD FINISHED"
          echo "=========================================="

      # ============================================================
      # 15. Verify final kernel
      # ============================================================
      - name: Verify kernel output
        working-directory: kernel
        run: |
          set -eux

          echo
          echo "Kernel output directory:"
          ls -lah out/arch/arm64/boot/

          echo
          echo "All output files:"
          find \
            out/arch/arm64/boot \
            -type f \
            -print

          test -f out/arch/arm64/boot/Image

          echo
          echo "FINAL KERNEL IMAGE EXISTS"

      # ============================================================
      # 16. Prepare artifact
      # ============================================================
      - name: Prepare kernel artifact
        run: |
          set -eux

          rm -rf kernel-output
          mkdir -p kernel-output

          BOOT="kernel/out/arch/arm64/boot"

          # Main kernel
          if [ -f "$BOOT/Image" ]; then
              cp "$BOOT/Image" kernel-output/
          fi

          if [ -f "$BOOT/Image.gz" ]; then
              cp "$BOOT/Image.gz" kernel-output/
          fi

          if [ -f "$BOOT/Image-dtb" ]; then
              cp "$BOOT/Image-dtb" kernel-output/
          fi

          if [ -f "$BOOT/Image.gz-dtb" ]; then
              cp "$BOOT/Image.gz-dtb" kernel-output/
          fi

          # DTB / DTBO
          find "$BOOT" \
            -type f \
            \( \
              -name "*.dtb" \
              -o \
              -name "*.dtbo" \
            \) \
            -exec cp {} kernel-output/ \;

          # Kernel config
          if [ -f kernel/out/.config ]; then
              cp kernel/out/.config \
                 kernel-output/kernel.config
          fi

          echo
          echo "=========================================="
          echo "FINAL ARTIFACT"
          echo "=========================================="

          ls -lah kernel-output

          COUNT=$(find kernel-output -type f | wc -l)

          echo
          echo "Files: $COUNT"

          test "$COUNT" -gt 0

      # ============================================================
      # 17. Upload
      # ============================================================
      - name: Upload RMX1827 Kernel
        uses: actions/upload-artifact@v4
        with:
          name: RMX1827-Kernel
          path: kernel-output
          if-no-files-found: error
