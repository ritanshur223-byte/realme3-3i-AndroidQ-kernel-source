name: Build Realme 3i Kernel (Self-Healing)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Install Dependencies & 32-bit Architecture
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential bc bison flex libssl-dev libncurses5-dev \
          libelf-dev liblz4-tool git ccache lzop python2 sed make \
          libc6:i386 libstdc++6:i386 zlib1g:i386

    - name: Clone AOSP GCC Toolchains
      run: |
        rm -rf gcc64 gcc32
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 gcc64 || git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64
        git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 gcc32 || git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32
        chmod -R +x gcc64 gcc32 2>/dev/null || true

    - name: Auto-Fixing Self-Healing Build Loop
      run: |
        # Auto-detect binary paths dynamically
        GCC64_DIR=$(dirname $(find $(pwd)/gcc64 -name "aarch64-linux-android-gcc" 2>/dev/null | head -n 1) 2>/dev/null || echo "$(pwd)/gcc64/bin")
        GCC32_DIR=$(dirname $(find $(pwd)/gcc32 -name "arm-linux-androideabi-gcc" 2>/dev/null | head -n 1) 2>/dev/null || echo "$(pwd)/gcc32/bin")

        export ARCH=arm64
        export SUBARCH=arm64
        export PATH=$GCC64_DIR:$GCC32_DIR:$PATH
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-
        export KBUILD_BUILD_USER=ritansh
        export KBUILD_BUILD_HOST=github-actions

        # Fix python interpreter
        sudo ln -sf /usr/bin/python2 /usr/bin/python

        # Initial Clean Setup
        make clean || true
        make oppo6771_defconfig

        # FIX DTC DUPLICATE EXTERN ISSUE
        find scripts/dtc/ -type f \( -name "*.c" -o -name "*.h" -o -name "*_shipped" \) -exec sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' {} +

        # Automatic Header Discovery
        AUTO_INCLUDES=$(find $(pwd)/drivers $(pwd)/include $(pwd)/vendor $(pwd)/kernel $(pwd)/arch -type f -name "*.h" 2>/dev/null | xargs -n1 dirname 2>/dev/null | sort -u | sed 's/^/-I/' | tr '\n' ' ')

        # Basic broken module cleanup
        if [ -d "kernel/oppocfs" ]; then rm -rf kernel/oppocfs; fi
        if [ -f "kernel/Makefile" ]; then sed -i '/oppocfs/d' kernel/Makefile || true; fi

        if [ -f ".config" ]; then
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/' .config
          sed -i 's/CONFIG_CC_STACKPROTECTOR_AUTO=y/# CONFIG_CC_STACKPROTECTOR_AUTO is not set/' .config
          grep -q "CONFIG_CC_STACKPROTECTOR_NONE=y" .config || echo "CONFIG_CC_STACKPROTECTOR_NONE=y" >> .config
          
          sed -i 's/CONFIG_VDSO=y/# CONFIG_VDSO is not set/' .config || true
          sed -i 's/CONFIG_COMPAT_VDSO=y/# CONFIG_COMPAT_VDSO is not set/' .config || true
          grep -q "# CONFIG_VDSO is not set" .config || echo "# CONFIG_VDSO is not set" >> .config
        fi

        mkdir -p include/autostubs

        # Prepare build scripts
        make -j1 scripts prepare HOSTCFLAGS="-w -fcommon" HOSTCXXFLAGS="-w -fcommon"

        # --- AUTO-FIX LOOP SCRIPT ---
        MAX_RETRIES=15
        RETRY_COUNT=0

        while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
          echo "=================================================="
          echo "   BUILD ATTEMPT: $((RETRY_COUNT + 1)) / $MAX_RETRIES"
          echo "=================================================="

          set +e
          make -j4 \
            HOSTCFLAGS="-w -fcommon" \
            HOSTCXXFLAGS="-w -fcommon" \
            KCFLAGS="-w -fcommon -fno-stack-protector -I$(pwd)/include/autostubs $AUTO_INCLUDES" \
            EXTRA_CFLAGS="-w -fcommon -I$(pwd)/include/autostubs $AUTO_INCLUDES" 2>&1 | tee build.log
          
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          if [ $BUILD_STATUS -eq 0 ]; then
            echo "SUCCESS: Kernel compiled successfully!"
            exit 0
          fi

          echo "Build failed. Analyzing logs for auto-fix..."
          FIX_APPLIED=0

          # 1. Catch missing header file errors safely
          MISSING_HEADERS=$(grep -oE "fatal error: [^:]+: No such file or directory" build.log | sed -E 's/fatal error: ([^:]+): No such file or directory/\1/' | sort -u || true)

          if [ -n "$MISSING_HEADERS" ]; then
            for header in $MISSING_HEADERS; do
              if [ -n "$header" ]; then
                echo "[AUTO-FIX] Creating stub for missing header: $header"
                STUB_DIR=$(dirname "$header")
                mkdir -p "include/autostubs/$STUB_DIR"
                printf "#ifndef AUTO_STUB_HEADER_H\n#define AUTO_STUB_HEADER_H\n#endif\n" > "include/autostubs/$header"
                FIX_APPLIED=1
              fi
            done
          fi

          # 2. Catch rrdump / ordasp include errors
          if grep -q "rrdump_private.h" build.log; then
            echo "[AUTO-FIX] Commenting out broken rrdump_private.h includes..."
            find drivers/misc/mediatek/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/#include\s*["<]rrdump_private.h[">]/\/\/#include "rrdump_private.h"/g' {} +
            FIX_APPLIED=1
          fi

          if [ $FIX_APPLIED -eq 0 ]; then
            echo "[AUTO-FIX] Retrying build with single thread (-j1)..."
            make -j1 \
              HOSTCFLAGS="-w -fcommon" \
              HOSTCXXFLAGS="-w -fcommon" \
              KCFLAGS="-w -fcommon -fno-stack-protector -I$(pwd)/include/autostubs $AUTO_INCLUDES" \
              EXTRA_CFLAGS="-w -fcommon -I$(pwd)/include/autostubs $AUTO_INCLUDES"
            exit $?
          fi

          RETRY_COUNT=$((RETRY_COUNT + 1))
        done

        echo "ERROR: Reached maximum retry limit ($MAX_RETRIES attempts)."
        exit 1

    - name: Upload Compiled Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Kernel-4.14.180
        path: |
          arch/arm64/boot/Image.gz-dtb
          arch/arm64/boot/Image.gz
          arch/arm64/boot/Image

          if [ -n "$MISSING_HEADERS" ]; then
            for header in $MISSING_HEADERS; do
              echo "[AUTO-FIX] Creating stub for missing header: $header"
              mkdir -p "include/autostubs/$(dirname "$header")"
              printf "#ifndef AUTO_STUB_HEADER_H\n#define AUTO_STUB_HEADER_H\n#endif\n" > "include/autostubs/$header"
              FIX_APPLIED=1
            done
          fi

          # 2. Catch rrdump / ordasp include errors
          if grep -q "rrdump_private.h" build.log; then
            echo "[AUTO-FIX] Commenting out broken rrdump_private.h includes..."
            find drivers/misc/mediatek/ -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/#include\s*["<]rrdump_private.h[">]/\/\/#include "rrdump_private.h"/g' {} +
            FIX_APPLIED=1
          fi

          if [ $FIX_APPLIED -eq 0 ]; then
            echo "[AUTO-FIX] Retrying build with single thread (-j1)..."
            make -j1 \
              HOSTCFLAGS="-w -fcommon" \
              HOSTCXXFLAGS="-w -fcommon" \
              KCFLAGS="-w -fcommon -fno-stack-protector -I$(pwd)/include/autostubs $AUTO_INCLUDES" \
              EXTRA_CFLAGS="-w -fcommon -I$(pwd)/include/autostubs $AUTO_INCLUDES"
            exit $?
          fi

          RETRY_COUNT=$((RETRY_COUNT + 1))
        done

        echo "ERROR: Reached maximum retry limit ($MAX_RETRIES attempts)."
        exit 1

    - name: Upload Compiled Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Kernel-4.14.180
        path: |
          arch/arm64/boot/Image.gz-dtb
          arch/arm64/boot/Image.gz
          arch/arm64/boot/Image
