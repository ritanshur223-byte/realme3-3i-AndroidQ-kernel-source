name: Realme 3i RMX1827 Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. DEPENDENCIES
      # ============================================================
      - name: Install dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            git \
            libelf-dev \
            libncurses5-dev \
            libssl-dev \
            rsync \
            unzip \
            zip

      # ============================================================
      # 2. CHECKOUT YOUR FORK
      # ============================================================
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ritanshur223-byte/realme3-3i-AndroidQ-kernel-source
          ref: master
          path: kernel
          fetch-depth: 1

      # ============================================================
      # 3. VERIFY SOURCE
      # ============================================================
      - name: Verify RMX1827 source
        working-directory: kernel
        run: |
          set -eux

          echo "=========================================="
          echo "REALME 3i RMX1827 SOURCE CHECK"
          echo "=========================================="

          echo
          echo "Kernel source:"
          pwd

          echo
          echo "Git commit:"
          git rev-parse HEAD

          echo
          echo "Checking defconfig..."
          test -f arch/arm64/configs/oppo6771_defconfig
          echo "OK: oppo6771_defconfig"

          echo
          echo "Checking DTS..."
          test -f arch/arm64/boot/dts/mediatek/oppo6771_18601.dts
          echo "OK: oppo6771_18601.dts"

          echo
          echo "Checking DWS..."
          test -f drivers/misc/mediatek/dws/mt6771/oppo6771_18601.dws
          echo "OK: oppo6771_18601.dws"

          echo
          echo "DWS:"
          ls -lah \
            drivers/misc/mediatek/dws/mt6771/oppo6771_18601.dws

          echo
          echo "DTS cust.dtsi include:"
          grep -n "cust.dtsi" \
            arch/arm64/boot/dts/mediatek/oppo6771_18601.dts

          echo
          echo "DrvGen command in source:"
          grep -n "DrvGen.py.*cust_dtsi\|cust_dtsi" \
            scripts/drvgen/drvgen.mk

          echo
          echo "SOURCE CHECK OK"

      # ============================================================
      # 4. AARCH64 GCC 4.9
      # ============================================================
      - name: Setup AArch64 GCC 4.9
        run: |
          set -eux

          git clone --depth=1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git \
            gcc

          echo "$GITHUB_WORKSPACE/gcc/bin" >> "$GITHUB_PATH"

      # ============================================================
      # 5. VERIFY GCC
      # ============================================================
      - name: Check compiler
        run: |
          set -eux

          which aarch64-linux-android-gcc

          aarch64-linux-android-gcc --version

      # ============================================================
      # 6. PYTHON 2
      # ============================================================
      - name: Setup Python 2
        run: |
          set -eux

          docker --version

          docker pull python:2.7

          docker run --rm \
            python:2.7 \
            python2 --version

      # ============================================================
      # 7. FIX DRVGEN OUTPUT PATH
      #
      # Original:
      #
      # ifndef DRVGEN_OUT
      # DRVGEN_OUT := $(objtree)/arch/$(SRCARCH)/boot/dts
      # endif
      #
      # With O=out we force it to current objtree.
      # ============================================================
      - name: Fix Driver Generator output path
        working-directory: kernel
        run: |
          set -eux

          python3 - <<'PY'
          from pathlib import Path

          p = Path("scripts/drvgen/drvgen.mk")
          s = p.read_text()

          old = """ifndef DRVGEN_OUT
          DRVGEN_OUT := $(objtree)/arch/$(SRCARCH)/boot/dts
          endif
          export DRVGEN_OUT"""

          new = """DRVGEN_OUT := $(objtree)/arch/$(SRCARCH)/boot/dts
          export DRVGEN_OUT"""

          if old not in s:
              raise SystemExit(
                  "ERROR: expected DRVGEN_OUT block not found"
              )

          s = s.replace(old, new)

          p.write_text(s)

          print("DRVGEN_OUT FIX APPLIED")
          PY

          echo
          echo "DRVGEN_OUT:"
          grep -n -A4 -B2 "DRVGEN_OUT" \
            scripts/drvgen/drvgen.mk

      # ============================================================
      # 8. VERIFY WE DID NOT BREAK cust_dtsi
      # ============================================================
      - name: Verify DrvGen command
        working-directory: kernel
        run: |
          set -eux

          echo "DrvGen command:"
          grep -n -A3 -B3 \
            "cust_dtsi" \
            scripts/drvgen/drvgen.mk

          grep -q "cust_dtsi" \
            scripts/drvgen/drvgen.mk

          echo
          echo "OK: cust_dtsi parameter is present"

      # ============================================================
      # 9. PYTHON 2 DRVGEN LAUNCHER
      #
      # Host:
      # /home/runner/work/.../kernel
      #
      # Docker:
      # /workspace/kernel
      #
      # All host paths are translated automatically.
      # ============================================================
      - name: Install Python 2 DrvGen launcher
        working-directory: kernel
        run: |
          set -eux
          mv tools/dct/DrvGen.py tools/dct/DrvGen.py.real
          cat > tools/dct/DrvGen.py <<'EOF'
          #!/bin/bash
          exec docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/kernel \
            python:2.7 python2 \
            /workspace/kernel/tools/dct/DrvGen.py.real "$@"
          EOF
          chmod +x tools/dct/DrvGen.py
      # ============================================================
      # 11. CONFIGURE KERNEL
      # ============================================================
      - name: Configure kernel
        working-directory: kernel
        run: |
          set -eux

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-

          rm -rf out

          make \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android- \
            oppo6771_defconfig

          test -f out/.config

          echo
          echo "=========================================="
          echo "KERNEL CONFIGURATION OK"
          echo "=========================================="

          echo
          echo "Important configuration:"

          grep -E \
            'CONFIG_MACH_MT6771|CONFIG_MTK_PLATFORM|CONFIG_ARCH_MTK_PROJECT|CONFIG_BUILD_ARM64_DTB' \
            out/.config || true

      # ============================================================
      # 12. VERIFY OUTPUT PATHS
      # ============================================================
      - name: Verify Kbuild paths
        working-directory: kernel
        run: |
          set -eux

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-

          mkdir -p \
            out/arch/arm64/boot/dts

          echo
          echo "Source directory:"
          pwd

          echo
          echo "DWS:"
          realpath \
            drivers/misc/mediatek/dws/mt6771/oppo6771_18601.dws

          echo
          echo "Output directory:"
          realpath \
            out/arch/arm64/boot/dts

          test -f \
            drivers/misc/mediatek/dws/mt6771/oppo6771_18601.dws

          test -d \
            out/arch/arm64/boot/dts

          echo
          echo "KBUILD PATH CHECK OK"

      # ============================================================
      # 13. TEST DRVGEN
      #
      # IMPORTANT:
      # Parameter = cust_dtsi
      # Generated file = cust.dtsi
      # ============================================================
      - name: Test MediaTek Driver Generator
        working-directory: kernel
        run: |
          set -eux

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-

          DWS="$(pwd)/drivers/misc/mediatek/dws/mt6771/oppo6771_18601.dws"

          OUT="$(pwd)/out/arch/arm64/boot/dts/oppo6771_18601"

          mkdir -p "$OUT"

          echo
          echo "=========================================="
          echo "TESTING DRVGEN"
          echo "=========================================="

          echo
          echo "DWS:"
          echo "$DWS"

          echo
          echo "OUTPUT:"
          echo "$OUT"

          echo
          echo "RUNNING DRVGEN..."

          tools/dct/DrvGen.py \
            "$DWS" \
            "$OUT" \
            "$OUT" \
            cust_dtsi

          echo
          echo "=========================================="
          echo "DRVGEN FINISHED"
          echo "=========================================="

          echo
          echo "Generated files:"

          find \
            "$OUT" \
            -maxdepth 2 \
            -type f \
            -print

          echo
          echo "Checking generated cust.dtsi..."

          test -f "$OUT/cust.dtsi"

          echo
          echo "cust.dtsi FOUND"

          ls -lah "$OUT/cust.dtsi"

      # ============================================================
      # 14. FULL KERNEL BUILD
      # ============================================================
      - name: Build kernel
        working-directory: kernel
        run: |
          set -eux

          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-

          echo
          echo "=========================================="
          echo "REALME 3i RMX1827 KERNEL BUILD"
          echo "=========================================="

          make \
            -j"$(nproc)" \
            O=out \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android- \
            HOSTCFLAGS="-fcommon" \
            V=1

          echo
          echo "=========================================="
          echo "KERNEL BUILD FINISHED"
          echo "=========================================="

      # ============================================================
      # 15. VERIFY FINAL OUTPUT
      # ============================================================
      - name: Verify kernel output
        working-directory: kernel
        run: |
          set -eux

          BOOT="out/arch/arm64/boot"

          echo
          echo "=========================================="
          echo "KERNEL OUTPUT"
          echo "=========================================="

          ls -lah "$BOOT"

          echo
          echo "All generated files:"

          find "$BOOT" \
            -type f \
            -print

          echo
          echo "Checking Image..."

          test -f "$BOOT/Image"

          echo
          echo "=========================================="
          echo "FINAL KERNEL IMAGE EXISTS"
          echo "=========================================="

          ls -lh "$BOOT/Image"

      # ============================================================
      # 16. PREPARE ARTIFACT
      # ============================================================
      - name: Prepare kernel artifact
        run: |
          set -eux

          rm -rf kernel-output

          mkdir -p kernel-output

          BOOT="kernel/out/arch/arm64/boot"

          echo "Collecting kernel files..."

          # --------------------------------------------------------
          # Image
          # --------------------------------------------------------
          if [ -f "$BOOT/Image" ]; then
              cp "$BOOT/Image" \
                kernel-output/
          fi

          # --------------------------------------------------------
          # Image.gz
          # --------------------------------------------------------
          if [ -f "$BOOT/Image.gz" ]; then
              cp "$BOOT/Image.gz" \
                kernel-output/
          fi

          # --------------------------------------------------------
          # Image-dtb
          # --------------------------------------------------------
          if [ -f "$BOOT/Image-dtb" ]; then
              cp "$BOOT/Image-dtb" \
                kernel-output/
          fi

          # --------------------------------------------------------
          # Image.gz-dtb
          # --------------------------------------------------------
          if [ -f "$BOOT/Image.gz-dtb" ]; then
              cp "$BOOT/Image.gz-dtb" \
                kernel-output/
          fi

          # --------------------------------------------------------
          # DTB / DTBO
          # --------------------------------------------------------
          find "$BOOT" \
            -type f \
            \( \
              -name "*.dtb" \
              -o \
              -name "*.dtbo" \
            \) \
            -exec cp {} kernel-output/ \;

          # --------------------------------------------------------
          # Config
          # --------------------------------------------------------
          if [ -f kernel/out/.config ]; then
              cp \
                kernel/out/.config \
                kernel-output/kernel.config
          fi

          echo
          echo "=========================================="
          echo "KERNEL ARTIFACT"
          echo "=========================================="

          ls -lah kernel-output

          COUNT=$(find kernel-output -type f | wc -l)

          echo
          echo "Artifact files: $COUNT"

          test "$COUNT" -gt 0

      # ============================================================
      # 17. UPLOAD
      # ============================================================
      - name: Upload RMX1827 Kernel
        uses: actions/upload-artifact@v4
        with:
          name: RMX1827-Kernel
          path: kernel-output
          if-no-files-found: error
